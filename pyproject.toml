[project]
name = "anki-castellano"
version = "0.1.0"
description = "Generate image-backed Spanish Anki decks using Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "genanki>=0.13",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.scripts]
wordlist    = "wordlist:main"
images      = "images:main"
create-deck = "create_deck:main"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W"]
